services:

  postgres:
    image: postgres:16
    container_name: studyplanner-postgres
    environment:
      POSTGRES_DB: studyplanner
      POSTGRES_USER: studyplanner
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U studyplanner -d studyplanner"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyplanner-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/studyplanner
      DB_USER: studyplanner
      DB_PASSWORD: change-me
      JWT_SECRET: change-me-to-a-long-random-secret
      JWT_EXPIRATION: 86400000
      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASS: ""
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyplanner-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres-data:
